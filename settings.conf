# AgentReaper — 動作設定
#
# 配布時の既定は「観測するだけ・何も変更しない」。
# --diagnose の結果を見て、自分の環境に合わせて変えること。

# --- 走査 ---

# 走査間隔（秒）。最低 10
scanIntervalSeconds = 30

# 定期走査で自動回収するか。false ならトレイメニューの「今すぐ軽くする」でのみ動く
autoReap = true

# ドライラン。true の間は一切終了させず、ログと画面表示だけ行う。
#
# 配布時の既定は true。慣れるまでこのままにしておくと、
# 「自分の環境で何が対象になるか」だけをログで観測できる。
#
# false にしても、AgentReaper.exe --approve でいまの signatures.conf を承認するまでは
# 回収は行われない（承認ゲート）。dryRun を false にするだけでは何も起きない。
dryRun = true

# CPU 無活動が何回連続したら回収してよいとみなすか。最低 2（設定では下げられない）
# scanIntervalSeconds = 30 かつ 3 なら、90 秒間 CPU を使っていないことが条件になる
idleScansRequired = 3

# 1 回の走査で終了させるプロセス数の上限（暴走ガード）
maxKillPerPass = 100

# --- 自動解放（実空きページの先回り回復） ---
#
# タスクマネージャーの「利用可能」は空きではない。実空き + スタンバイの合計であり、
# スタンバイは他プロセスが使っていたページなので、再利用の前にゼロ化が要る。
# 実空き（FreeAndZero）が枯渇すると、ページを新規に確保するたびにゼロ化待ちが入る。
# GPU が同期的にメモリを要求した瞬間にそれが起きると、画面とマウスが止まる。
#
# autoLighten は、実空きが閾値を割った時点でメモリリスト操作を実行して先回りする。
# 昇格が要るので install-elevated-task.ps1 で登録したタスク経由でだけ動く（UAC は毎回は出ない）。
#
# 配布時の既定は OFF。効き方は機種で違う。--diagnose の memory を見てから有効化すること。
autoLighten = false

# 実空き（FreeAndZero）がこの GB を割ったら発動する
autoLightenFreeGb = 6.0

# 連続発動の最短間隔（秒）。スラッシング防止。最低 30
autoLightenCooldownSeconds = 180

# --- メモリリスト操作（「今すぐ軽くする」実行時・自動解放時。管理者権限が必要） ---

# 変更済みリストをディスクへ書き出して解放可能にする
flushModifiedList = true

# 低優先スタンバイのみ解放する。安全側
purgeLowPriorityStandby = true

# 全スタンバイを削除する。
# 実空きが枯渇した状態からの即効性は最も高いが、キャッシュを全部捨てるので
# 直後にディスクからの読み直しが発生する。NVMe なら実害は小さかった（作者環境での実測）。
# 既定 OFF。自分の環境で --lighten を手動で試してから決めること。
purgeAllStandby = false

# 全プロセスのワーキングセットを切り詰める。既定 OFF
# 次に触った瞬間ページフォルトで戻るため、体感が悪化しやすい
emptyAllWorkingSets = false

# --- 警告のしきい値（トレイアイコンが赤くなる条件） ---
#
# 判定は実空きページだけで行う。プロセス数は使わない。
# 作者環境の実測では、726 プロセスで DWM コマ落ち 11%、522 プロセスでも 0% だった。
# プロセス数は体感の重さと相関しない。誤報は本物の警告まで無視させる。

warnFreeGb = 5

# --- 除外 ---

# 絶対に終了させない PID をカンマ区切りで指定する
excludePids =
