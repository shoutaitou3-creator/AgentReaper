# AgentReaper — 回収対象シグネチャ定義
#
# ここは空の状態で配布している。あなたの環境に何が残っているかは、あなたの環境でしか分からない。
# 自分で書くか、AGENTS.md を自分の ClaudeCode / Codex に読ませて書かせること。
#
# 最初にやること:
#   AgentReaper.exe --diagnose --json
# reapCandidates に「孤児・30分以上放置・CPU ほぼゼロ」のグループが出る。
# その sampleCommandLines から、そのサーバーだけを特定できる文字列を選んでパターンにする。
#
# ------------------------------------------------------------------
# 書式:  名前 | 照合先 | パターン | クライアントごとに残す最新数 | 猶予(分)
#
#   照合先   : cmdline（コマンドライン） / name（プロセス名） / path（実行ファイルパス）
#   パターン : 大文字小文字を無視した部分一致。正規表現ではない
#   残す最新数: そのクライアント配下で新しい方から何個を必ず温存するか（最低 1）
#   猶予(分) : 生成からこの時間内は必ず温存する（最低 5）
#
# 一致したプロセスは、その子孫プロセスごと 1 つのツリーとして扱われる。
# たとえば cmd.exe → node.exe → python.exe はまとめて 1 ツリーとして回収される。
# ------------------------------------------------------------------
#
# パターンの選び方 — ここを間違えると自分の作業プロセスを殺す:
#
#   良い : パッケージ名・サーバー固有の名前          mcpvault / antigravity-intern / cua_node
#   悪い : ランタイム名・フォルダ名・汎用語          node / python / server.js / node_modules
#
# パス区切りに依存しない部分文字列を選ぶこと。
# "@scope/pkg" と書くと、実際のコマンドラインが "...\node_modules\@scope\pkg\dist\server.js" の
# ようにバックスラッシュ形式で、一致しない。"pkg" だけで拾う。
#
# 以下は AgentReaper が機械的に拒否する（設定では無効化できない）:
#   - 4 文字未満のパターン
#   - node / python / chrome のような広すぎる語（完全一致で拒否）
#   - エディタ・端末・OS 中核プロセスに当たるパターン
#   - 走査時に 7 種類以上の実行ファイルへ当たったパターン
#   - 走査時に全プロセスの 15% 超へ当たったパターン
#   - CPU を 60 秒以上使っているプロセスへ当たったパターン
#
# 編集したら必ず:
#   AgentReaper.exe --dry-run     何が対象になるかを見る
#   AgentReaper.exe --approve     納得したら承認する
# 承認するまで、settings.conf が dryRun = false でもプロセスは終了しない。
#
# ------------------------------------------------------------------
# 例（作者の環境のもの。そのまま使わず、自分の --diagnose の結果から書き直すこと）
#
# mcpvault           | cmdline | mcpvault           | 2 | 30
# antigravity-intern | cmdline | antigravity-intern | 2 | 30
# codex-cua-node     | cmdline | cua_node           | 2 | 30
#
# 停止した ClaudeCode フックスクリプト。
# フックは本来ミリ秒で終わるが、CPU を 1 秒も使わないまま固まり、
# 親セッションが死んだ後も居座る個体が溜まっていた。
#   実測: 55 件が全て孤児 / 全件 CPU 0 秒 / 最古 9,318 分（6.5 日）/ 計約 2.6GB
# 広いパターンに見えるが、猶予 30 分 + CPU 無活動 3 回 + 最新 N 個温存の三重ガードがあるため、
# 実行中のフックが対象になることはない。30 分生き残った時点で故障個体。
#
# claude-hooks       | cmdline | hook-              | 1 | 30
